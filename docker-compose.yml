services:
  aria2bot:
    # 预构建镜像（linux/amd64），需要自己构建时把 image 换成 your-name/aria2bot:latest 并保留 build
    image: ghcr.io/github-xihe/aria2bot:latest
    network_mode: host
    container_name: aria2bot
    restart: always
    # 镜像内默认以 uid/gid 1000 运行；请确保 ./db 归该用户所有：
    #   sudo chown -R 1000:1000 ./db
    user: "1000:1000"
    volumes:
      - ./db:/app/db
      - /root/downloads:/root/downloads
      - /qqqq:/qqqq
    build: .
    environment:
      TZ: Asia/Shanghai
