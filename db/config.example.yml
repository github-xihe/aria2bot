API_ID: xxxx
API_HASH: xxxxxxxx
BOT_TOKEN: xxxx:xxxxxxxxxxxx
ADMIN_ID: 管理员ID
FORWARD_ID: 转发id
#默认是否上传到电报 true 或者 false
UP_TELEGRAM: true
#aria2c 设置
RPC_SECRET: xxxxxxx
RPC_URL: xxxxxx:6800/jsonrpc
#AriaNg 前端地址（/web 命令生成深链用）；留空回退 http://127.0.0.1:6880
ARIANG_BASE: http://192.168.1.10:6880
#/web 是否下发内嵌 base64(RPC_SECRET) 的 AriaNg 深链
#默认 false：只给地址、端口和脱敏后的密钥，需要你在 AriaNg 设置里手动填密钥
#设为 true 会生成可直接打开的深链，但密钥会长期留在 Telegram 云端聊天记录里
ARIANG_SHARE_SECRET: false

#代理ip 不需要留空,目前代理只支持代理bot，aria2c 连接不支持代理目前
PROXY_IP:
PROXY_PORT: